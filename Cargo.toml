[package]
name = "confibatch_pool"
version = "0.1.0"
edition = "2021"
description = "Shielded note pool and confidential batch-swap contract for Soroban"
license = "Apache-2.0"
repository = "https://github.com/Confihub/confibatch_pool"
readme = "README.md"
keywords = ["stellar", "soroban", "privacy", "zkp", "defi"]
rust-version = "1.91"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = { version = "27.0.3", features = ["hazmat-crypto"] }
# The verifier is maintained in a separate repository. Pin the reviewed ABI/client
# source instead of following a mutable branch.
groth16_verifier = { git = "https://github.com/Confihub/groth16_verifier", rev = "39c58a3126d2da839915367637d3176f2d83d2df", default-features = false }

[dev-dependencies]
soroban-sdk = { version = "27.0.3", features = ["testutils"] }
mobile_v2_hasher = { path = "mobile_v2_hasher" }

[features]
default = ["export-contract"]
export-contract = []

# Soroban contracts build as small, LTO'd cdylibs for wasm.
[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
